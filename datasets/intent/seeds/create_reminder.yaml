- text: "set a reminder for the dentist at eleven thirty a m"
  intent: create_reminder
  args: {text: "dentist", hour: 11, minute: 30, meridiem: "am"}
- text: "remind me to pay the rent"
  intent: create_reminder
  args: {text: "pay the rent"}
- text: "add a reminder to buy milk"
