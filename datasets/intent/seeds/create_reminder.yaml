# Alarms and reminders are the same capability. An in-process alarm would die
# with the process exactly as timers do, and "wake me at 2am" is precisely the
# case where that is useless -- so both go to Reminders.app, which survives a
# restart and syncs.
#
# THE MODEL REPORTS THE CLOCK FACE IT HEARD; PYTHON BUILDS THE DATE. Same reason
# timers report {value, unit} instead of seconds: a 1.7B model doing date
# arithmetic produces something plausible and wrong, silently. "2 am" said at
# 11 pm means tomorrow, and resolving that is Python's job.

- text: "set an alarm for two a m"
  intent: create_reminder
  args: {text: "Alarm", hour: 2, minute: 0, meridiem: "am"}
- text: "set an alarm for seven thirty a m"
  intent: create_reminder
  args: {text: "Alarm", hour: 7, minute: 30, meridiem: "am"}
- text: "wake me up at six a m"
  intent: create_reminder
  args: {text: "Alarm", hour: 6, minute: 0, meridiem: "am"}
- text: "set an alarm for nine p m"
  intent: create_reminder
  args: {text: "Alarm", hour: 9, minute: 0, meridiem: "pm"}
- text: "alarm at five thirty"
  intent: create_reminder
  args: {text: "Alarm", hour: 5, minute: 30}

- text: "remind me to call mom at seven p m"
  intent: create_reminder
  args: {text: "call mom", hour: 7, minute: 0, meridiem: "pm"}
- text: "remind me to take the bins out at eight a m"
