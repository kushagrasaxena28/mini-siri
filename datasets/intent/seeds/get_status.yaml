# One intent, one enum-checked reading. Grouping battery/wifi/bluetooth/storage/
# chip/device/date/day under get_status{item} rather than eight separate intents
# keeps the class count low for a 1.7B model and the output token count flat.
#
# DATE AND DAY LIVE HERE, NOT IN get_time. Live testing found "What is the day
# right now?" answered "It's 7:45 P M." -- silently wrong, which is the worst
# failure class in this project.

# -- battery ------------------------------------------------------------------
- text: "what is my laptop's battery"
  intent: get_status
  args: {item: "battery"}
- text: "how much battery do I have left"
  intent: get_status
  args: {item: "battery"}
- text: "what's my battery at"
  intent: get_status
  args: {item: "battery"}
- text: "battery status"
  intent: get_status
  args: {item: "battery"}
- text: "is my laptop charging"
  intent: get_status
  args: {item: "battery"}
- text: "how much charge is left"
  intent: get_status
  args: {item: "battery"}

