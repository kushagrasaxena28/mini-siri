# provenance: llm_draft -- pending human spot-check.
#
# The largest class deliberately. An always-listening mic hears far more non-commands
# than commands, and a confident misfire here is worse than a refusal (safety model §4).
# No args -- correct behaviour is silence, not a guess.
#
# The NEAR-MISS section is the most important part of this file. Zero-shot eval fired
# open_app on "I opened terminal earlier" -- a past-tense description of an action, not
# a request for one. Those are the cases that make an always-listening assistant
# unusable, so they are heavily represented: past tense, third person, hypothetical,
# negated, and questions ABOUT a capability rather than invocations of it.

