# -- from live testing: system state is not a capability -----------------------
# "What is my laptop's battery?" emitted intent "get_battery", which is not in the
# enum and was rejected. There is no system-status capability at all; the model
# must decline rather than invent an intent name for one.
# -- from live testing: LISTING is not opening or searching --------------------
# "What all folders do I have in downloads?" OPENED Downloads, and "What all notes
# do I have?" searched for the literal word "notes". Neither listing capability
# exists; performing an adjacent action instead is worse than declining.
# -- from live testing: arbitrary folders are not openable ---------------------
# "Open C underscore engines" and "Open super thirty folder" resolved to
# open_path{"C engines"} / {"super thirty"} and were rejected. open_path is a
# fixed list of eight standard folders by design -- a project directory is not one.
