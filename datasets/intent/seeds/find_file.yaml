# provenance: llm_draft -- pending human spot-check.
#
# Added after "Can you open Kushagr underscore resume pdf?" was rejected -- there
# was no file-search capability at all.
#
# THE QUERY IS SEARCH TERMS, NEVER A PATH. The executor runs it through Spotlight
# scoped to the user's home directory. Labels therefore strip filler ("my", "the",
# "a file called") and keep the distinctive words, because that is what matches a
# filename. The validator rejects anything path-shaped as a second line of defence.
#
# Distinct from open_path, which opens a FIXED, allowlisted FOLDER.

# -- documents / resumes -------------------------------------------------------
- text: "find my resume"
  intent: find_file
  args: {query: "resume"}
- text: "find my resume pdf"
  intent: find_file
  args: {query: "resume"}
- text: "can you open my resume"
  intent: find_file
  args: {query: "resume"}
- text: "where is my resume file"
  intent: find_file
  args: {query: "resume"}
- text: "look for my cover letter"
  intent: find_file
  args: {query: "cover letter"}
- text: "find the tax document"
  intent: find_file
  args: {query: "tax"}
- text: "find my passport scan"
  intent: find_file
  args: {query: "passport scan"}

