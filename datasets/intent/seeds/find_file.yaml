# -- filler-heavy / conversational ------------------------------------------------
- text: "um can you find my resume"
  intent: find_file
  args: {query: "resume"}
- text: "hey where is that budget file"
  intent: find_file
  args: {query: "budget"}
- text: "can you look for a file called timesheet"
  intent: find_file
  args: {query: "timesheet"}
- text: "I need to find the invoice from last month"
  intent: find_file
  args: {query: "invoice"}
- text: "search my files for the design doc"
  intent: find_file
  args: {query: "design doc"}

# ASR spells punctuation out as words. "Open annual underscore report dot pdf"
# produced the query "annual underscore report" -- Spotlight will never match a
# filename against the literal word "underscore". Spoken punctuation and the
# extension are not search terms.
- text: "open annual underscore report dot pdf"
  intent: find_file
  args: {query: "annual report"}
- text: "find my resume dot pdf"
  intent: find_file
  args: {query: "resume"}
- text: "open budget underscore twenty twenty four dot xlsx"
  intent: find_file
  args: {query: "budget"}
- text: "find the file called notes dot txt"
  intent: find_file
  args: {query: "notes"}
- text: "open the invoice dot pdf"
  intent: find_file
  args: {query: "invoice"}
