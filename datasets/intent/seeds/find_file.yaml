# -- by type -------------------------------------------------------------------
- text: "find the screenshot from yesterday"
  intent: find_file
  args: {query: "screenshot"}
- text: "find my meeting notes"
  intent: find_file
  args: {query: "meeting notes"}
- text: "where did I save the contract"
