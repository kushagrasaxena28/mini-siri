# -- full-content retention (eval: "Note, ask Sarah about the budget." kept only "the budget") --
# The note text is everything after the trigger, verbatim -- not just the tail noun phrase.
- text: "note, email Tom about the contract"
  intent: capture_note
  args: {text: "email Tom about the contract"}
