# provenance: llm_draft -- pending human spot-check.
#
# `text` is the note CONTENT with the trigger phrase stripped. Zero-shot eval missed
# "remember that the wifi password is on the fridge" entirely, so the trigger
# vocabulary is deliberately broad here: note / note to self / make a note /
# remember / don't forget / jot down / write down / take a note / add a note.
#
# Trigger-stripping is the arg-extraction skill being taught: the model must drop
# "note that" and keep the rest verbatim, including any leading article.

# -- "note ..." ------------------------------------------------------------------
- text: "note check the cache config tomorrow"
  intent: capture_note
  args: {text: "check the cache config tomorrow"}
- text: "note check the cache config"
  intent: capture_note
  args: {text: "check the cache config"}
- text: "note, ask Sarah about the budget"
  intent: capture_note
  args: {text: "ask Sarah about the budget"}
- text: "note the encoder frame is 80 milliseconds"
  intent: capture_note
  args: {text: "the encoder frame is 80 milliseconds"}
- text: "note that the deploy is scheduled for Monday"
  intent: capture_note
  args: {text: "the deploy is scheduled for Monday"}
- text: "note that I need to renew my passport"
  intent: capture_note
  args: {text: "I need to renew my passport"}

