# -- contrastive pairs for triggers that ALSO appear bare in unknown.yaml -----------
# Each of these uses the SAME trigger word as a bare/empty unknown.yaml example, so
# the model learns "is there content after the trigger", not "which word was used".
# Fixed a real regression: without these, "Remember that Jake prefers morning
# meetings." and "Write this down, the server restarts at midnight." were being
# declined as unknown after the empty-trigger examples were added.
- text: "remember this, the meeting is at 3pm"
  intent: capture_note
  args: {text: "the meeting is at 3pm"}
- text: "remember this: the gate code is 4471"
  intent: capture_note
  args: {text: "the gate code is 4471"}
- text: "write this down, pick up dry cleaning on Friday"
  intent: capture_note
  args: {text: "pick up dry cleaning on Friday"}
- text: "jot this down, the invoice number is 88213"
  intent: capture_note
  args: {text: "the invoice number is 88213"}
- text: "take a note, the wifi password changed"
  intent: capture_note
  args: {text: "the wifi password changed"}
- text: "add a note, the flight got delayed to 9pm"
  intent: capture_note
  args: {text: "the flight got delayed to 9pm"}
- text: "make a note, call the plumber tomorrow"
  intent: capture_note
  args: {text: "call the plumber tomorrow"}

# -- reinforcing "note that X" specifically: only 2 examples existed, and it is a
# very natural high-frequency phrasing. Regressed to unknown after the empty-"note"
# negative was added (1:2 ratio for this exact clause pattern was not enough).
- text: "note that I need milk"
  intent: capture_note
  args: {text: "I need milk"}
- text: "note that we're out of coffee"
  intent: capture_note
  args: {text: "we're out of coffee"}
- text: "note that the printer is out of toner"
  intent: capture_note
  args: {text: "the printer is out of toner"}
- text: "note that Friday is a holiday"
  intent: capture_note
  args: {text: "Friday is a holiday"}
- text: "note that the invoice was paid"
  intent: capture_note
  args: {text: "the invoice was paid"}

# -- "remember X" reinforcement (regression sweep 2026-08-18) -------------------------
# These exact phrasings failed the post-training sweep. Two were held-out (landed in
# valid/test splits, so never trained) and one was trained verbatim but still missed --
# "remember the ..." starts identically to the bare "remember this" -> unknown trigger,
# so the decision boundary needs more density on this side of it.
- text: "remember the spare key is under the mat"
  intent: capture_note
  args: {text: "the spare key is under the mat"}
- text: "remember the standup moved to 10am"
  intent: capture_note
  args: {text: "the standup moved to 10am"}
- text: "remember that the landlord is coming Tuesday"
  intent: capture_note
  args: {text: "the landlord is coming Tuesday"}
- text: "remember that Priya is on leave next week"
  intent: capture_note
  args: {text: "Priya is on leave next week"}
- text: "don't let me forget to renew the insurance"
  intent: capture_note
  args: {text: "renew the insurance"}
- text: "don't let me forget the parking permit expires Friday"
  intent: capture_note
  args: {text: "the parking permit expires Friday"}
- text: "remember the router password is on the box"
  intent: capture_note
  args: {text: "the router password is on the box"}

# Trigger verbs the model lost when multi-command unknowns were added: the note
# intents share vocabulary with "open notes" and had to be re-separated.
- text: "jot down that Priya moved desks"
  intent: capture_note
  args: {text: "Priya moved desks"}
- text: "jot down the meeting is at four"
  intent: capture_note
  args: {text: "the meeting is at four"}
- text: "save a note the spare key is under the mat"
  intent: capture_note
  args: {text: "the spare key is under the mat"}
- text: "save a note that the invoice is paid"
  intent: capture_note
  args: {text: "the invoice is paid"}
- text: "remind me in my notes that the visa expires in May"
  intent: capture_note
  args: {text: "the visa expires in May"}
- text: "put in my notes that the car needs new tyres"
  intent: capture_note
  args: {text: "the car needs new tyres"}
- text: "write down that the boiler service is due in March"
  intent: capture_note
  args: {text: "the boiler service is due in March"}

# -- from live testing: "add some notes for me that X" declined ----------------
# The longest, most natural phrasing in the session -- "Can you add some notes for
# me that I have a meeting at seven fifty?" -- returned unknown. The note verb is
# wrapped in a request and separated from its content by "that".
- text: "can you add some notes for me that I have a meeting at seven fifty"
  intent: capture_note
  args: {text: "I have a meeting at seven fifty"}
- text: "can you add a note that I have a meeting at ten"
  intent: capture_note
  args: {text: "I have a meeting at ten"}
- text: "add to my notes that the deploy is on friday"
  intent: capture_note
  args: {text: "the deploy is on friday"}
- text: "can you note down that the rent is due on the fifth"
  intent: capture_note
  args: {text: "the rent is due on the fifth"}
- text: "add a note for me that the keys are with the neighbour"
  intent: capture_note
  args: {text: "the keys are with the neighbour"}
- text: "can you make a note that I parked on level three"
  intent: capture_note
  args: {text: "I parked on level three"}
