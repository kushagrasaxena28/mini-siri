# -- playpause --------------------------------------------------------------------
- text: "play pause"
  intent: media_control
  args: {action: "playpause"}
- text: "toggle playback"
  intent: media_control
  args: {action: "playpause"}

# -- filling thin coverage: "playpause" had only 2 examples -------------------------
- text: "hit play pause"
  intent: media_control
  args: {action: "playpause"}
- text: "toggle play"
  intent: media_control
  args: {action: "playpause"}
- text: "hit the play button"
  intent: media_control
  args: {action: "playpause"}
- text: "just toggle it"
  intent: media_control
  args: {action: "playpause"}

# -- "can you play music" declined ----------------------------------------------
# Live testing: "Can you play music?" returned unknown. "play the music" and "play"
# were both present; the polite-request wrapper was not, and it is how people
# actually ask.
- text: "can you play music"
  intent: media_control
  args: {action: "play"}
- text: "can you play the music"
  intent: media_control
  args: {action: "play"}
- text: "can you play some music"
  intent: media_control
  args: {action: "play"}
- text: "can you resume the music"
  intent: media_control
  args: {action: "play"}
- text: "can you pause the music"
  intent: media_control
  args: {action: "pause"}
- text: "can you pause this"
  intent: media_control
  args: {action: "pause"}
- text: "can you skip this song"
  intent: media_control
  args: {action: "next"}
- text: "can you play the next track"
  intent: media_control
  args: {action: "next"}
- text: "can you go back a song"
  intent: media_control
  args: {action: "previous"}

# "Play." and "Resume the music." produced a degenerate repetition loop
# (playpausepausepause...) rather than a clean action. Short, bare forms need
# explicit coverage so the model is not guessing between play and playpause.
- text: "resume"
  intent: media_control
  args: {action: "play"}
- text: "start the music"
  intent: media_control
  args: {action: "play"}
- text: "play it"
  intent: media_control
  args: {action: "play"}
- text: "play music"
  intent: media_control
  args: {action: "play"}
- text: "carry on playing"
  intent: media_control
  args: {action: "play"}
