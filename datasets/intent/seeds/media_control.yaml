# provenance: llm_draft -- pending human spot-check.
#
# action in {play, pause, playpause, next, previous}.
# Filler-heavy and vague-referent variants are over-represented: zero-shot eval
# missed "um can you skip this" (returned unknown), so "this"/"that"/"it" as the
# object of a playback verb needs to be learned as a media reference.

# -- pause ------------------------------------------------------------------------
- text: "pause the music"
  intent: media_control
  args: {action: "pause"}
- text: "pause"
  intent: media_control
  args: {action: "pause"}
- text: "can you pause that"
  intent: media_control
  args: {action: "pause"}
- text: "hey pause"
  intent: media_control
  args: {action: "pause"}
- text: "stop the music"
  intent: media_control
  args: {action: "pause"}
- text: "pause it"
  intent: media_control
  args: {action: "pause"}
- text: "um can you pause this"
  intent: media_control
  args: {action: "pause"}
- text: "pause the song"
  intent: media_control
  args: {action: "pause"}
- text: "hold the music"
  intent: media_control
  args: {action: "pause"}

