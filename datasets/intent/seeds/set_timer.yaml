# provenance: llm_draft -- pending human spot-check.
#
# Numbers deliberately mix word form ("ten minutes") and digit form ("10 minutes") --
# Stage 1 found Parakeet emits both for the same audio depending on silence padding.
#
# SCHEMA: {value, unit}, NOT duration_seconds. The model reports the number it
# HEARD and names the unit; Python multiplies. Asking a 1.7B model to emit
# duration_seconds directly produced 10x digit errors on the fine-tuned
# checkpoint ("three hours" -> 1080 instead of 10800). See schema/intents.py
# _check_timer for the measurements.


# -- seconds -----------------------------------------------------------------
- text: "timer for 30 seconds"
  intent: set_timer
  args: {value: 30, unit: "seconds"}
- text: "set a 10 second timer"
