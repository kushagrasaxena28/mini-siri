# Enumerating is not opening and not searching. Live testing found "What all
# folders do I have in downloads?" OPENED Downloads, and "What all notes do I
# have?" searched for the literal word "notes" -- both adjacent actions rather
# than the one asked for.
#
# `where` is an ALLOWED_PATHS key, so listing can never walk outside the eight
# standard folders.

- text: "what all notes do I have"
  intent: list_items
  args: {what: "notes"}
- text: "list my notes"
  intent: list_items
  args: {what: "notes"}
- text: "how many notes do I have"
  intent: list_items
  args: {what: "notes"}
- text: "show me all my notes"
  intent: list_items
  args: {what: "notes"}
- text: "what notes are there"
  intent: list_items
  args: {what: "notes"}
- text: "read out my notes"
  intent: list_items
  args: {what: "notes"}

- text: "what all folders do I have in downloads"
  intent: list_items
  args: {what: "files", where: "downloads"}
- text: "what's in my downloads"
  intent: list_items
  args: {what: "files", where: "downloads"}
- text: "list the files in documents"
  intent: list_items
  args: {what: "files", where: "documents"}
- text: "what's on my desktop"
  intent: list_items
  args: {what: "files", where: "desktop"}
- text: "show me what's in my pictures"
  intent: list_items
  args: {what: "files", where: "pictures"}
- text: "how many files are in downloads"
  intent: list_items
  args: {what: "files", where: "downloads"}
- text: "what files are in my movies folder"
  intent: list_items
  args: {what: "files", where: "movies"}

