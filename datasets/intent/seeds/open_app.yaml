# -- open-vs-close disambiguation ------------------------------------------------------
# Paired against close_app.yaml so "open X" and "turn off X" are learned as
# OPPOSITES rather than both collapsing to open_app.
- text: "open WhatsApp"
  intent: open_app
  args: {app_name: "WhatsApp"}
- text: "open WhatsApp for me"
  intent: open_app
  args: {app_name: "WhatsApp"}
- text: "can you open Apple Music"
  intent: open_app
  args: {app_name: "Music"}
- text: "launch WhatsApp"
  intent: open_app
  args: {app_name: "WhatsApp"}
- text: "start Terminal"
  intent: open_app
  args: {app_name: "Terminal"}

# -- APP vs FOLDER, the confusion found in live testing --------------------------
# "Can you open notes?" resolved to open_path{"notes"} and was rejected, twice.
# open_path carries fourteen "open X" examples against three "can you open X" here,
# so the phrasing itself pulled toward folders. Notes/Music/Preview are the
# dangerous names because each is also a plausible place.
- text: "can you open notes"
  intent: open_app
  args: {app_name: "Notes"}
- text: "can you open notes for me"
  intent: open_app
  args: {app_name: "Notes"}
- text: "open notes"
  intent: open_app
  args: {app_name: "Notes"}
- text: "open the notes app"
  intent: open_app
  args: {app_name: "Notes"}
- text: "can you open the calendar"
  intent: open_app
  args: {app_name: "Calendar"}
- text: "can you open mail"
  intent: open_app
  args: {app_name: "Mail"}
- text: "can you open messages"
  intent: open_app
  args: {app_name: "Messages"}
- text: "can you open finder"
  intent: open_app
  args: {app_name: "Finder"}
- text: "can you open preview"
  intent: open_app
  args: {app_name: "Preview"}
- text: "can you open safari for me"
  intent: open_app
  args: {app_name: "Safari"}
- text: "can you open spotify please"
  intent: open_app
  args: {app_name: "Spotify"}
- text: "can you open uh apple music"
  intent: open_app
  args: {app_name: "Music"}
- text: "can you open activity monitor"
  intent: open_app
  args: {app_name: "Activity Monitor"}

