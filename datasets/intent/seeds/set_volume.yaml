# -- "more" phrasings (real bug: produced direction "more", which is not valid) --------
# "more" after a volume verb means UP. The model emitted it as a literal
# direction and the validator rejected it -- correct, but the user just wanted
# the volume raised.
- text: "increase the volume more"
  intent: set_volume
  args: {direction: "up"}
- text: "can you increase the volume more"
  intent: set_volume
  args: {direction: "up"}
- text: "make the volume more up"
  intent: set_volume
  args: {direction: "up"}
- text: "turn it up more"
  intent: set_volume
  args: {direction: "up"}
- text: "a bit more volume"
  intent: set_volume
  args: {direction: "up"}
- text: "louder please"
  intent: set_volume
  args: {direction: "up"}
- text: "increase the volume"
  intent: set_volume
  args: {direction: "up"}
- text: "decrease the volume"
  intent: set_volume
  args: {direction: "down"}
- text: "decrease the volume more"
  intent: set_volume
  args: {direction: "down"}
- text: "turn it down more"
  intent: set_volume
  args: {direction: "down"}
- text: "make the volume up"
  intent: set_volume
  args: {direction: "up"}
- text: "can you make the volume up"
  intent: set_volume
  args: {direction: "up"}
- text: "lower it more"
  intent: set_volume
  args: {direction: "down"}

# "Set volume to N" fell to 4/9 held-out. The cause was three unknown seeds
# sharing the exact surface form ("set the volume to five hundred" -> unknown),
# which have been removed -- out-of-range levels are the VALIDATOR's job. These
# reinforce the positive form.
- text: "set the volume to twenty five"
  intent: set_volume
  args: {direction: "set", level: 25}
- text: "set the volume to eighty"
  intent: set_volume
  args: {direction: "set", level: 80}
- text: "change the volume to sixty"
