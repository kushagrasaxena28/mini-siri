# search_notes vs find_file: both are "look for something", and the model started
# collapsing them. NOTES live in Notes.app; FILES live on disk. These are the
# phrasings that flipped to find_file on held-out data.
- text: "look through my notes for anything about Priya"
  intent: search_notes
  args: {query: "Priya"}
- text: "look through my notes for the spare key"
  intent: search_notes
  args: {query: "spare key"}
- text: "search my notes for the boiler service"
  intent: search_notes
  args: {query: "boiler service"}
- text: "check my notes for anything about the visa"
  intent: search_notes
  args: {query: "visa"}
- text: "go through my notes for the parking permit"
  intent: search_notes
  args: {query: "parking permit"}
- text: "anything in my notes about the invoice"
  intent: search_notes
  args: {query: "invoice"}

# -- the word "notes" is not a search term ---------------------------------------
# Live testing: "Can you search for notes chapter one?" produced
# query="notes chapter one". Every note matches the word "notes", so the search
# returned seventeen results and read out an unrelated one. The query is what to
# look FOR, never the word "notes" itself.
- text: "can you search for notes chapter one"
  intent: search_notes
  args: {query: "chapter one"}
- text: "can you check for chapter one in notes"
  intent: search_notes
  args: {query: "chapter one"}
- text: "search notes for the onboarding doc"
  intent: search_notes
  args: {query: "onboarding doc"}
- text: "can you look in notes for the recipe"
  intent: search_notes
  args: {query: "recipe"}
- text: "search my notes for notes about the migration"
  intent: search_notes
  args: {query: "migration"}
- text: "can you find in my notes the address"
  intent: search_notes
  args: {query: "address"}
